<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NC Landing Builder — v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115;--bg2:#151922;--panel:#1a1f2b;--panel2:#202634;
    --line:#2a3140;--line2:#333c4e;--ink:#e7ecf3;--muted:#9aa6b8;--muted2:#6b7688;
    --acc:#6B5FFF;--acc2:#A8E63D;--danger:#ff5d6c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;overflow:hidden}
  button,input,select,textarea{font-family:inherit}
  .app{display:flex;flex-direction:column;height:100vh}

  .topbar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
  .brandmark{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.2px}
  .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--acc),var(--acc2))}
  .brandmark small{color:var(--muted);font-weight:500;font-size:11px}
  .spacer{flex:1}
  .lbl{color:var(--muted);font-size:12px}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--muted);padding:7px 11px;cursor:pointer;font-size:12.5px;font-weight:500}
  .seg button.on{background:var(--panel2);color:var(--ink)}
  select.sel,input.txt{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600}
  .btn:hover{border-color:var(--line2)}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.sm{padding:5px 9px;font-size:11.5px}
  .btn.ghost{background:transparent}
  .btn.icob{padding:8px 10px}
  .btn:disabled{opacity:.4;cursor:default}

  .main{display:flex;flex:1;min-height:0}
  .col{min-height:0;display:flex;flex-direction:column}
  .left{flex:0 0 230px;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto}
  .center{flex:1;background:var(--bg);position:relative;display:flex;flex-direction:column;align-items:center;overflow:auto}
  .right{flex:0 0 336px;background:var(--bg2);border-left:1px solid var(--line);overflow-y:auto}

  .search{margin:10px;position:sticky;top:0}
  .search input{width:100%}
  .paneltitle{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted2);padding:12px 12px 4px}
  .cat{padding:0 8px 8px}
  .chip{display:flex;align-items:center;gap:9px;padding:8px 10px;margin:5px 4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;cursor:grab;font-size:12.5px;user-select:none}
  .chip:hover{border-color:var(--acc);background:var(--panel2)}
  .chip .ico{width:22px;height:22px;border-radius:6px;background:var(--panel2);display:grid;place-items:center;font-size:12px;flex:0 0 auto}
  .chip .k{color:var(--muted2);font-size:14px;margin-left:auto}

  .stage{padding:20px;width:100%;display:flex;justify-content:center}
  .frameWrap{position:relative;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45);transition:width .18s ease;overflow:hidden}
  iframe#pv{border:0;display:block;width:100%;height:calc(100vh - 150px);background:#fff}
  .drop{position:absolute;inset:0;display:none;place-items:center;background:rgba(107,95,255,.14);border:2px dashed var(--acc);border-radius:14px;z-index:5;color:#fff;font-weight:700}
  .hint{color:var(--muted2);font-size:12px;margin:8px 0 4px;text-align:center;max-width:900px}

  .block{border-bottom:1px solid var(--line)}
  .outline{padding:6px 10px 12px;max-height:34vh;overflow:auto}
  .oitem{display:flex;align-items:center;gap:6px;padding:7px 8px;margin:5px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:12.5px;cursor:grab}
  .oitem.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
  .oitem .grip{color:var(--muted2)}
  .oitem .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .oitem .mini{background:transparent;border:0;color:var(--muted2);cursor:pointer;font-size:12.5px;padding:2px 3px;border-radius:5px}
  .oitem .mini:hover{background:var(--panel2);color:var(--ink)}
  .oitem.dragover{border-color:var(--acc2)}
  .tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:2}
  .tabs button{flex:1;background:transparent;border:0;color:var(--muted);padding:10px 6px;cursor:pointer;font-size:12px;font-weight:600;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
  .fields{padding:12px 14px 30px}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
  .fld input,.fld textarea,.fld select{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}
  .fld textarea{min-height:66px;resize:vertical;line-height:1.5}
  .fld .help{color:var(--muted2);font-size:10.5px;margin-top:4px}
  .fld.inline{display:flex;align-items:center;gap:8px}
  .fld.inline label{margin:0;flex:1}
  .fld.inline input[type=color]{width:44px;height:30px;padding:2px;flex:0 0 auto}
  .fld.inline input[type=range]{flex:1}
  .row2{display:flex;gap:10px}.row2>*{flex:1}
  .up .thumbrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .thumb{height:40px;max-width:110px;object-fit:contain;background:#0b0e14;border:1px solid var(--line);border-radius:6px;padding:3px}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .thumbs .t{position:relative}
  .thumbs .t img{height:44px;width:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
  .thumbs .t button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--danger);border:0;color:#fff;font-size:11px;cursor:pointer;line-height:1}
  .empty{color:var(--muted2);padding:24px 16px;text-align:center;font-size:12.5px;line-height:1.6}
  .rep-item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--panel)}
  .rep-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:11px;color:var(--muted2)}
  .rep-head .mini{background:transparent;border:0;color:var(--muted2);cursor:pointer;font-size:12px;padding:1px 4px;border-radius:4px}
  .rep-head .mini:hover{background:var(--panel2);color:var(--ink)}
  .note{margin:10px 0;padding:10px 12px;background:rgba(107,95,255,.08);border:1px solid rgba(107,95,255,.25);border-radius:8px;color:var(--muted);font-size:11.5px;line-height:1.5}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#10331a;border:1px solid #1f6b36;color:#c7f9d6;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2b3342;border-radius:8px;border:2px solid var(--bg2)}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brandmark"><span class="dot"></span> NC Landing Builder <small>· v2</small></div>
    <input id="landingName" class="txt" style="max-width:180px" placeholder="Nombre de la landing" title="Nombre" autocomplete="off" name="nc_landing_name" data-lpignore="true" data-1p-ignore data-form-type="other">
    <button class="btn" id="btnSave" title="Guardar en la nube">💾 Guardar</button>
    <button class="btn" id="btnMine" title="Mis landings">☁ Mis landings</button>
    <div class="spacer"></div>
    <span class="lbl" id="userChip"></span>
    <button class="btn icob" id="btnUndo" title="Deshacer (Ctrl+Z)">↺</button>
    <button class="btn icob" id="btnRedo" title="Rehacer (Ctrl+Y)">↻</button>
    <select class="sel" id="tplSel" title="Cargar plantilla"><option value="">Plantilla…</option></select>
    <span class="lbl">Marca</span>
    <select class="sel" id="brandTop"></select>
    <div class="seg" id="devSeg">
      <button data-dev="mobile">Móvil</button><button data-dev="tablet">Tablet</button><button data-dev="desktop" class="on">Desktop</button>
    </div>
    <button class="btn" id="btnPreview">Abrir ⧉</button>
    <button class="btn primary" id="btnExport">Exportar ZIP ↓</button>
  </div>

  <div class="main">
    <div class="col left">
      <div class="search"><input class="txt" id="palSearch" type="search" name="nc_block_search" placeholder="Buscar bloque…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other"></div>
      <div id="palette"></div>
    </div>

    <div class="col center">
      <div class="stage">
        <div class="frameWrap" id="frameWrap" style="width:100%;max-width:1100px">
          <div class="drop" id="dropZone">Suelta aquí para añadir</div>
          <iframe id="pv" title="preview"></iframe>
        </div>
      </div>
      <div class="hint">Arrastra bloques al lienzo · clic en una sección para editar · en el preview aparecen ↑↓⧉🗑 sobre la sección activa · reordena en “Estructura”.</div>
    </div>

    <div class="col right">
      <div class="block">
        <div class="paneltitle">Estructura <span id="secCount" style="color:var(--muted2)"></span></div>
        <div class="outline" id="outline"></div>
      </div>
      <div class="tabs">
        <button data-tab="content" class="on">Contenido</button>
        <button data-tab="style">Estilo</button>
        <button data-tab="global">Global</button>
      </div>
      <div id="tabContent"><div class="fields" id="contentFields"></div></div>
      <div id="tabStyle" style="display:none"><div class="fields" id="styleFields"></div></div>
      <div id="tabGlobal" style="display:none"><div class="fields" id="globalFields"></div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- Login compartido -->
<div id="loginOverlay" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(9,11,16,.92);backdrop-filter:blur(4px);place-items:center">
  <div style="width:340px;max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px">
    <div class="brandmark" style="justify-content:center;margin-bottom:6px"><span class="dot"></span> NC Landing Builder</div>
    <div style="text-align:center;color:var(--muted2);font-size:12px;margin-bottom:16px">Acceso del equipo</div>
    <div class="fld"><label>Email</label><input id="loginEmail" class="txt" style="width:100%" type="email" placeholder="equipo@nextconversion.es"></div>
    <div class="fld"><label>Contraseña</label><input id="loginPass" class="txt" style="width:100%" type="password" placeholder="••••••••"></div>
    <button class="btn primary" id="loginBtn" style="width:100%;margin-top:6px">Entrar</button>
    <div id="loginErr" style="color:var(--danger);font-size:11.5px;margin-top:8px;text-align:center"></div>
  </div>
</div>

<!-- Mis landings -->
<div id="mineOverlay" style="display:none;position:fixed;inset:0;z-index:190;background:rgba(9,11,16,.7);place-items:center">
  <div style="width:520px;max-width:94vw;max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <b>Mis landings</b>
      <span><button class="btn sm" id="mineNew">+ Nueva</button> <button class="btn sm ghost" id="mineClose">Cerrar</button></span>
    </div>
    <div id="mineList"><div class="empty">Cargando…</div></div>
  </div>
</div>

<script>
/* ============================================================
   NC LANDING BUILDER v2
   Motor de secciones · salida Bootstrap 5.3.3 + tokens de marca
   Imágenes Base64 · controles de estilo · editor de tema · undo/redo
   ============================================================ */

/* ---------- MARCAS ---------- */
const FONTS=["Inter","Poppins","Montserrat","Outfit","Manrope","Sora","DM Sans","Work Sans","Space Grotesk","Nunito","Mulish","Lato","Roboto","Open Sans","Raleway","Rubik","Karla","Figtree","Plus Jakarta Sans","Onest","Archivo","Libre Franklin","Source Sans 3","IBM Plex Sans","Barlow","Josefin Sans","Quicksand","Urbanist","Epilogue","Red Hat Display","Bricolage Grotesque","Oswald","Bebas Neue","Anton","Playfair Display","Merriweather","Fraunces","DM Serif Display","Lora","Cormorant Garamond","Space Mono","JetBrains Mono","IBM Plex Mono"];
const FONT_SERIF=["Playfair Display","Merriweather","Fraunces","Lora","Cormorant Garamond"];
const FONT_ONE=["Bebas Neue","Anton","DM Serif Display"];
function fontWeights(n){return FONT_ONE.includes(n)?"wght@400":FONT_SERIF.includes(n)?"wght@400;500;600;700":"wght@400;500;600;700;800";}
function fontsHref(head,body){
  const fam=n=>encodeURIComponent(n).replace(/%20/g,"+");
  const set=[...new Set([head,body].filter(Boolean))];
  return "https://fonts.googleapis.com/css2?"+set.map(n=>"family="+fam(n)+":"+fontWeights(n)).join("&")+"&display=swap";
}
function fontsHrefMany(names){
  const fam=n=>encodeURIComponent(n).replace(/%20/g,"+");
  const set=[...new Set(names.filter(Boolean))];
  if(!set.length)return "";
  return "https://fonts.googleapis.com/css2?"+set.map(n=>"family="+fam(n)+":"+fontWeights(n)).join("&")+"&display=swap";
}
const BRANDS = {
  nc:{name:"Next Conversion", locked:true,
    vars:"--bp:#6E5AFF;--bp2:#5646d6;--ba:#C1FF33;--bink:#312937;--bmuted:#6b6472;--bsoft:#F3F1FF;--line:#E7E4F5;--btnr:8px;--cardr:16px;",
    fhead:"'Space Grotesk',sans-serif",fbody:"'Inter',sans-serif",fonts:fontsHref("Space Grotesk","Inter"),
    note:"Extraído en vivo de nextconversion.es · morado #6E5AFF + lima #C1FF33 + tinta #312937 · Space Grotesk."},
  assista:{name:"Assista Digital", locked:true,
    vars:"--bp:#d02320;--bp2:#b1040e;--ba:#00112b;--bink:#00112b;--bmuted:#54606f;--bsoft:#f6f7f9;--line:#e4e7ec;--btnr:50rem;--cardr:0 18px 0 18px;",
    fhead:"'Outfit',sans-serif",fbody:"'Montserrat',sans-serif",fonts:fontsHref("Outfit","Montserrat"),
    note:"Botones pill y esquinas de card asimétricas (brandbook Grupo Assista)."},
  tuawa:{name:"Tuawa (Global Omnium)", locked:true,
    vars:"--bp:#134D8F;--bp2:#0e3c72;--ba:#3BB5B0;--bink:#0c2338;--bmuted:#5a6b7c;--bsoft:#eef4fb;--line:#dbe6f0;--btnr:10px;--cardr:14px;",
    fhead:"'Manrope',sans-serif",fbody:"'Manrope',sans-serif",fonts:fontsHref("Manrope","Manrope"),
    note:"Satoshi no está en Google Fonts: sustituida por Manrope."},
  custom:{name:"Editable", locked:false,
    vars:"--bp:#2563EB;--bp2:#1d4ed8;--ba:#10B981;--bink:#0f172a;--bmuted:#475569;--bsoft:#f1f5f9;--line:#e2e8f0;--btnr:10px;--cardr:14px;",
    fhead:"'Inter',sans-serif",fbody:"'Inter',sans-serif",fonts:fontsHref("Inter","Inter"),
    note:"Marca editable: ajusta colores, tipografías y radios en la pestaña Global."},

  /* ---- Referencia externa (aproximado, ajustable) ---- */
  apple:{name:"Apple", locked:true, ref:true,
    vars:"--bp:#0071E3;--bp2:#0066CC;--ba:#1D1D1F;--bink:#1D1D1F;--bmuted:#86868B;--bsoft:#F5F5F7;--line:#D2D2D7;--btnr:999px;--cardr:28px;",
    fhead:"'Inter',sans-serif",fbody:"'Inter',sans-serif",fonts:fontsHref("Inter","Inter"),
    note:"Perfil de estilo completo (sistema de diseño Apple documentado): SF Pro→Inter, tinta #1D1D1F, azul #0071E3, gris #F5F5F7, botones pill 44px, cards 28px sin borde, sombras sutiles, tipografía a gran escala con tracking negativo y mucho aire.",
    profileCSS:`/* Apple style profile */

.display-4{font-size:clamp(2.7rem,6vw,4.6rem);letter-spacing:-0.04em;line-height:1.03}
.display-5{font-size:clamp(2.2rem,5vw,3.5rem);letter-spacing:-0.035em;line-height:1.05}
.display-6{font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-0.03em}
.lead{font-size:1.32rem;line-height:1.45;letter-spacing:-0.01em}
:root{--secpad-S:44px;--secpad-M:80px;--secpad-L:112px;--secpad-XL:150px}
.btn-brand,.btn-ghost{border-radius:999px;min-height:44px;font-weight:500;padding:.5rem 1.35rem;box-shadow:none;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.btn-ghost{border-width:1px}
.btn-lg{font-size:17px;min-height:50px;padding:.65rem 1.7rem}
.brandcard{background:#F5F5F7;border:none;border-radius:28px;box-shadow:none;color:#1D1D1F}
.brandcard.featured{box-shadow:0 12px 32px rgba(0,0,0,.10);border:none}
.badge-soft{background:rgba(0,113,227,.10);border:none;color:#0071E3}
.accordion-item{border:none!important;border-bottom:1px solid #D2D2D7!important;border-radius:0!important;background:transparent}
.accordion-button{font-weight:500;padding-left:0;padding-right:0}
.accordion-body{padding-left:0;padding-right:0}
.apple-link:hover{text-decoration:underline!important}`},
  movistar:{name:"Movistar", locked:true, ref:true,
    vars:"--bp:#019DF4;--bp2:#0284c7;--ba:#0B2739;--bink:#0B2739;--bmuted:#5a6b7c;--bsoft:#EAF6FE;--line:#d7e8f4;--btnr:999px;--cardr:16px;",
    fhead:"'Poppins',sans-serif",fbody:"'Inter',sans-serif",fonts:fontsHref("Poppins","Inter"),
    note:"Azul Movistar #019DF4 + navy Telefónica. On Air→Poppins/Inter.",

.brandcard{border-radius:20px;border-color:#e0eef8;box-shadow:0 6px 22px rgba(1,157,244,.08)}
.badge-soft{background:#e6f5fe;color:#0284c7;border:0}
h1,h2,h3{letter-spacing:-.01em}`},
  verizon:{name:"Verizon", locked:true, ref:true,
    vars:"--bp:#EE0000;--bp2:#c20000;--ba:#000000;--bink:#000000;--bmuted:#6f6f6f;--bsoft:#F6F6F6;--line:#e2e2e2;--btnr:0px;--cardr:0px;",
    fhead:"'Inter',sans-serif",fbody:"'Inter',sans-serif",fonts:fontsHref("Inter","Inter"),
    note:"Aproximado. Rojo #EE0000 + negro, estética muy plana y esquinas rectas. Verizon NHG sustituida por Inter."},
  tmobile:{name:"T-Mobile", locked:true, ref:true,
    vars:"--bp:#E20074;--bp2:#b8005f;--ba:#000000;--bink:#1A1A1A;--bmuted:#6b6b6b;--bsoft:#FBEAF3;--line:#f0d6e5;--btnr:999px;--cardr:16px;",
    fhead:"'Poppins',sans-serif",fbody:"'Inter',sans-serif",fonts:fontsHref("Poppins","Inter"),
    note:"Magenta corporativo #E20074 + negro. TeleGrotesk→Poppins/Inter.",
    profileCSS:`.btn-brand{border-radius:999px;font-weight:800;padding:.62rem 1.5rem;box-shadow:0 8px 22px rgba(226,0,116,.28)}
.brandcard{border-radius:20px;border-color:#f3d3e4}
.badge-soft{background:#fde7f2;color:#E20074;border:0}
h1,.display-4,.display-5{font-weight:800;letter-spacing:-.02em}`},
  o2:{name:"O2", locked:true, ref:true,
    vars:"--bp:#0019A5;--bp2:#001480;--ba:#26D9C3;--bink:#0A1F44;--bmuted:#566079;--bsoft:#EAF0FF;--line:#d5ddf3;--btnr:999px;--cardr:16px;",
    fhead:"'Poppins',sans-serif",fbody:"'Inter',sans-serif",fonts:fontsHref("Poppins","Inter"),
    note:"Azul O2 ~#0019A5 + acento aqua, motivo de burbujas. On Air→Poppins/Inter.",
    profileCSS:`.btn-brand{border-radius:999px;font-weight:700}
.brandcard{border-radius:22px;border-color:#dbe3fb}
.badge-soft{background:#e7ebff;color:#0019A5;border:0}`},
  mytraffic:{name:"MyTraffic (dark)", locked:true, ref:true,

  BRANDS.custom.vars=`--bp:${CUSTOM.bp};--bp2:${shade(CUSTOM.bp,.82)};--ba:${CUSTOM.ba};--bink:${CUSTOM.ink};--bmuted:#5b6573;--bsoft:${CUSTOM.soft};--line:#e2e8f0;--btnr:${CUSTOM.btnr}px;--cardr:${CUSTOM.cardr}px;`;

}

function secOpen(st){

  if(isImg){const o=OVL[st.overlay]||.45;bgcss=`background:linear-gradient(rgba(0,0,0,${o}),rgba(0,0,0,${o})),url('${st.bgimg}') center/cover no-repeat;`;}
  else bgcss=`background:${b.c};`;
  const dark=b.d||isImg;
  let head=dark?"#ffffff":"var(--bink)"; let mut=dark?"rgba(255,255,255,.80)":"var(--bmuted)";
  if(st.titleColor)head=st.titleColor; if(st.textColor)mut=st.textColor;
  const align=st.align==="center"?"text-center":"";
  let extra="";
  if(st.headFont)extra+=`--fhead:'${st.headFont}',sans-serif;`;
  if(st.titleWeight)extra+=`--titlew:${st.titleWeight};`;
  if(st.accentColor)extra+=`--bp:${st.accentColor};--bp2:${st.accentColor};`;
  // separador con forma (SVG en color de la propia sección)
  const DIVCOL={white:"#ffffff",soft:"var(--bsoft)",tint:"var(--bsoft)",primary:"var(--bp)",ink:"var(--bink)"};
  const dc=DIVCOL[st.bg]||"#ffffff"; let svg="";
  if(!isImg && st.divider && st.divider!=="none"){
    let path="";
    if(st.divider==="wave")path="M0,50 L0,26 C300,4 900,48 1200,26 L1200,50 Z";
    else if(st.divider==="curve")path="M0,50 L0,50 Q600,-6 1200,50 Z";
    else if(st.divider==="diagup")path="M0,50 L1200,8 L1200,50 Z";
    else if(st.divider==="diagdown")path="M0,8 L1200,50 L0,50 Z";
    if(path)svg=`<svg aria-hidden="true" viewBox="0 0 1200 50" preserveAspectRatio="none" style="position:absolute;left:0;top:-49px;width:100%;height:50px;display:block"><path d="${path}" fill="${dc}"/></svg>`;
  }
  const pos=(svg?"position:relative;":"");
  return `<section style="${pos}${bgcss}padding:var(--secpad-${st.pad||'M'}) 0;--headcol:${head};--txtmuted:${mut};color:${dark?'#fff':'inherit'};${extra}">${svg}<div class="container ${align}" style="${WIDTH[st.width]||''}">`;
}

function styleOf(s){return Object.assign({},STYLE_DEF,LIB[s.type].styleDef||{},s.style||{});}
function renderSection(s){
  const lib=LIB[s.type]; const inner=lib.render(s.props||{});
  if(lib.raw) return inner;
  return secOpen(styleOf(s))+inner+secClose();
}

/* ---------- PREVIEW ---------- */
let pendingScrollId=null;
function renderPreview(){const f=document.getElementById("pv");
  f.onload=function(){if(pendingScrollId){try{const el=f.contentDocument.querySelector('[data-sec="'+pendingScrollId+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"center"});}catch(e){}pendingScrollId=null;}};
  f.srcdoc=buildDoc(false);renderOutline();}
function patchSection(id){const s=state.sections.find(x=>x.id===id);if(!s)return;
  const doc=document.getElementById("pv").contentDocument;if(!doc){renderPreview();return;}
  const wrap=doc.querySelector('[data-sec="'+id+'"]');if(!wrap){renderPreview();return;}
  const tb=wrap.querySelector('.nc-tb');
  wrap.innerHTML=(tb?tb.outerHTML:"")+renderSection(s);}

/* ---------- PALETA ---------- */
function renderPalette(){
  const ps=document.getElementById("palSearch");
  let q=(ps&&ps.value||"").toLowerCase();
  if(q.indexOf("@")>-1){ q=""; if(ps)ps.value=""; }   // el navegador autocompleta el email: lo descartamos
  const cats={};ORDER.forEach(t=>{const b=LIB[t];if(b.brand&&b.brand!==state.settings.brand)return;if(q&&!(b.label.toLowerCase().includes(q)||b.cat.toLowerCase().includes(q)))return;(cats[b.cat]=cats[b.cat]||[]).push(t);});
  let h="";Object.keys(cats).forEach(cat=>{h+=`<div class="paneltitle">${cat}</div><div class="cat">`;
    cats[cat].forEach(t=>{const b=LIB[t];h+=`<div class="chip" draggable="true" data-add="${t}"><span class="ico">${b.ico}</span> ${b.label}<span class="k">+</span></div>`;});h+="</div>";});
  const p=document.getElementById("palette");p.innerHTML=h||`<div class="empty">Sin resultados</div>`;
  p.querySelectorAll('.chip[data-add]').forEach(c=>{
    c.addEventListener('dragstart',()=>{dragType=c.dataset.add;showDrop(true);});
    c.addEventListener('dragend',()=>showDrop(false));
    c.addEventListener('click',()=>addSection(c.dataset.add));});
}

/* ---------- ESTRUCTURA ---------- */
function renderOutline(){const o=document.getElementById("outline");
  document.getElementById("secCount").textContent="· "+state.sections.length;
  if(!state.sections.length){o.innerHTML=`<div class="empty">Vacío. Arrastra un bloque o haz clic en la izquierda.</div>`;return;}
  o.innerHTML=state.sections.map((s,i)=>`<div class="oitem ${s.id===state.selected?'sel':''}" draggable="true" data-id="${s.id}" data-i="${i}"><span class="grip">⋮⋮</span><span class="nm">${LIB[s.type].label}</span><button class="mini" data-act="up">↑</button><button class="mini" data-act="down">↓</button><button class="mini" data-act="dup">⧉</button><button class="mini" data-act="del">🗑</button></div>`).join("");
  o.querySelectorAll('.oitem').forEach(el=>{const id=el.dataset.id;
    el.addEventListener('click',e=>{if(e.target.dataset.act)return;select(id);});
    el.querySelectorAll('.mini').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();rowAction(id,btn.dataset.act);}));
    el.addEventListener('dragstart',()=>{dragId=id;dragType=null;});
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('dragover');});
    el.addEventListener('dragleave',()=>el.classList.remove('dragover'));
    el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('dragover');dropOnIndex(parseInt(el.dataset.i,10));});});
}

/* ---------- CAMPOS (content/style) ---------- */
function subField(sf,it,repk,i){
  const v=it[sf.k];
  if(sf.t==="select")return `<select data-rf="${repk}" data-ri="${i}" data-rk="${sf.k}">${sf.opts.map(o=>`<option value="${o[0]}" ${String(v)===o[0]?'selected':''}>${o[1]}</option>`).join("")}</select>`;
  if(sf.t==="image"){const key=repk+"|"+i+"|"+sf.k;return `<div class="up"><input type="file" accept="image/*" data-rfile="${key}" style="display:none"><div class="thumbrow">${v?`<img class="thumb" src="${v}">`:""}<button type="button" class="btn sm" data-rup="${key}">${v?"Cambiar":"Subir"}</button>${v?`<button type="button" class="btn sm ghost" data-rrm="${key}">Quitar</button>`:""}</div></div>`;}
  if(sf.t==="ta")return `<textarea data-rf="${repk}" data-ri="${i}" data-rk="${sf.k}">${esc(v||"")}</textarea>`;
  return `<input data-rf="${repk}" data-ri="${i}" data-rk="${sf.k}" value="${esc(v||"")}">`;
}
function defRepItem(f){const o={};(f.item||[]).forEach(sf=>{o[sf.k]=(sf.def!==undefined?sf.def:"");});return o;}
function fieldHTML(f,obj){
  const v=obj[f.k];
  if(f.t==="elements"){const L=arr(v);const lbl={};(f.parts||[]).forEach(pp=>lbl[pp[0]]=pp[1]);
    return `<div class="rep">${L.map((it,i)=>`<div class="rep-item" style="display:flex;align-items:center;gap:8px;padding:7px 9px"><input type="checkbox" data-elon="${f.k}" data-ei="${i}" ${it.on!==false?'checked':''}><span style="flex:1">${esc(lbl[it.k]||it.k)}</span><button type="button" class="mini" data-emv="${f.k}" data-ei="${i}" data-d="up">↑</button><button type="button" class="mini" data-emv="${f.k}" data-ei="${i}" data-d="down">↓</button></div>`).join("")}</div>`;}
  if(f.t==="repeater"){const L=arr(v);return `<div class="rep">${L.map((it,i)=>`<div class="rep-item"><div class="rep-head"><b>#${i+1}</b><span><button type="button" class="mini" data-rmv="${f.k}" data-ri="${i}" data-d="up">↑</button><button type="button" class="mini" data-rmv="${f.k}" data-ri="${i}" data-d="down">↓</button><button type="button" class="mini" data-rdel="${f.k}" data-ri="${i}">✕</button></span></div>${(f.item||[]).map(sf=>`<div class="fld"><label>${sf.l}</label>${subField(sf,it,f.k,i)}</div>`).join("")}</div>`).join("")}<button type="button" class="btn sm" data-radd="${f.k}">+ ${f.addLabel||'Añadir'}</button></div>`;}
  if(f.t==="ta")return `<textarea data-fk="${f.k}">${esc(v||"")}</textarea><div class="help">Una fila por línea; campos separados por “|”.</div>`;
  if(f.t==="select")return `<select data-fk="${f.k}">${f.opts.map(o=>`<option value="${o[0]}" ${String(v)===o[0]?'selected':''}>${o[1]}</option>`).join("")}</select>`;
  if(f.t==="image")return `<div class="up"><input type="file" accept="image/*" data-file="${f.k}" style="display:none"><div class="thumbrow">${v?`<img class="thumb" src="${v}">`:""}<button type="button" class="btn sm" data-upbtn="${f.k}">${v?"Cambiar":"Subir imagen"}</button>${v?`<button type="button" class="btn sm ghost" data-rm="${f.k}">Quitar</button>`:""}</div><div class="help">Se incrusta en el HTML (Base64).</div></div>`;
  if(f.t==="images"){const L=arr(v);return `<div class="up"><input type="file" accept="image/*" multiple data-filem="${f.k}" style="display:none"><div class="thumbs">${L.map((s,i)=>`<div class="t"><img src="${s}"><button type="button" data-rmi="${f.k}" data-i="${i}">×</button></div>`).join("")}</div><button type="button" class="btn sm" data-upbtnm="${f.k}">+ Añadir imágenes</button></div>`;}
  return `<input data-fk="${f.k}" value="${esc(v||"")}" placeholder="${esc(f.ph||"")}">`;
}
function bindContentFields(container,obj,after,fields){
  const rr=()=>{renderRight();renderPreview();};
  container.querySelectorAll('textarea[data-fk],input[data-fk]').forEach(inp=>inp.addEventListener('input',()=>{commitDebounced();obj[inp.dataset.fk]=inp.value;after();}));
  container.querySelectorAll('select[data-fk]').forEach(inp=>inp.addEventListener('change',()=>{commit();obj[inp.dataset.fk]=inp.value;after();renderRight();}));
  container.querySelectorAll('[data-upbtn]').forEach(btn=>btn.addEventListener('click',()=>container.querySelector('[data-file="'+btn.dataset.upbtn+'"]').click()));
  container.querySelectorAll('[data-file]').forEach(inp=>inp.addEventListener('change',e=>readImg(e.target.files[0],url=>{commit();obj[inp.dataset.file]=url;renderRight();renderPreview();})));
  container.querySelectorAll('[data-rm]').forEach(btn=>btn.addEventListener('click',()=>{commit();obj[btn.dataset.rm]="";renderRight();renderPreview();}));
  container.querySelectorAll('[data-upbtnm]').forEach(btn=>btn.addEventListener('click',()=>container.querySelector('[data-filem="'+btn.dataset.upbtnm+'"]').click()));
  container.querySelectorAll('[data-filem]').forEach(inp=>inp.addEventListener('change',e=>{const fs=Array.from(e.target.files);commit();obj[inp.dataset.filem]=arr(obj[inp.dataset.filem]);let n=fs.length;fs.forEach(file=>readImg(file,url=>{obj[inp.dataset.filem].push(url);if(--n===0){renderRight();renderPreview();}}));}));
  container.querySelectorAll('[data-rmi]').forEach(btn=>btn.addEventListener('click',()=>{commit();arr(obj[btn.dataset.rmi]).splice(parseInt(btn.dataset.i,10),1);renderRight();renderPreview();}));
  // repeater
  container.querySelectorAll('[data-rf]').forEach(inp=>inp.addEventListener(inp.tagName==='SELECT'?'change':'input',()=>{commitDebounced();const it=arr(obj[inp.dataset.rf])[+inp.dataset.ri];if(it){it[inp.dataset.rk]=inp.value;after();}}));
  container.querySelectorAll('[data-radd]').forEach(btn=>btn.addEventListener('click',()=>{const f=(fields||[]).find(x=>x.k===btn.dataset.radd);if(!f)return;commit();obj[f.k]=arr(obj[f.k]);obj[f.k].push(defRepItem(f));rr();}));
  container.querySelectorAll('[data-rdel]').forEach(btn=>btn.addEventListener('click',()=>{commit();arr(obj[btn.dataset.rdel]).splice(+btn.dataset.ri,1);rr();}));
  container.querySelectorAll('[data-rmv]').forEach(btn=>btn.addEventListener('click',()=>{const a=arr(obj[btn.dataset.rmv]);const i=+btn.dataset.ri;const j=btn.dataset.d==='up'?i-1:i+1;if(j<0||j>=a.length)return;commit();const t=a[i];a[i]=a[j];a[j]=t;rr();}));
  container.querySelectorAll('[data-rup]').forEach(btn=>btn.addEventListener('click',()=>container.querySelector('[data-rfile="'+CSS.escape(btn.dataset.rup)+'"]').click()));
  container.querySelectorAll('[data-rfile]').forEach(inp=>inp.addEventListener('change',e=>{const p=inp.dataset.rfile.split('|');readImg(e.target.files[0],url=>{commit();const it=arr(obj[p[0]])[+p[1]];if(it){it[p[2]]=url;rr();}});}));
  container.querySelectorAll('[data-rrm]').forEach(btn=>btn.addEventListener('click',()=>{const p=btn.dataset.rrm.split('|');commit();const it=arr(obj[p[0]])[+p[1]];if(it){it[p[2]]="";rr();}}));
  container.querySelectorAll('[data-elon]').forEach(cb=>cb.addEventListener('change',()=>{commit();const it=arr(obj[cb.dataset.elon])[+cb.dataset.ei];if(it){it.on=cb.checked;after();}}));
  container.querySelectorAll('[data-emv]').forEach(btn=>btn.addEventListener('click',()=>{const a=arr(obj[btn.dataset.emv]);const i=+btn.dataset.ei;const j=btn.dataset.d==='up'?i-1:i+1;if(j<0||j>=a.length)return;commit();const t=a[i];a[i]=a[j];a[j]=t;renderRight();renderPreview();}));
}
function readImg(file,cb){ if(!file)return;
  if(window.NC_SB){
    const clean=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const path=Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_'+clean;
    const bucket=(window.NC_CONFIG&&window.NC_CONFIG.BUCKET)||'landings-assets';
    toast('Subiendo imagen…');
    window.NC_SB.storage.from(bucket).upload(path,file,{cacheControl:'3600',upsert:false}).then(function(r){
      if(r.error){toast('Error al subir: '+r.error.message);return;}
      const pub=window.NC_SB.storage.from(bucket).getPublicUrl(path);
      cb(pub.data.publicUrl); toast('Imagen subida ✓');
    });
  } else {
    if(file.size>3*1024*1024)toast('⚠ Imagen >3MB: engordará el HTML');
    const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file);
  }
}

    syncCustom();commit();state.settings.brand="custom";document.getElementById("brandTop").value="custom";renderPreview();renderRight();toast("Copiado a marca editable");});
  gf.querySelectorAll('[data-ct]').forEach(inp=>{const ev=(inp.type==="range"||inp.type==="color")?'input':'change';
    inp.addEventListener(ev,()=>{commitDebounced();const k=inp.dataset.ct;CUSTOM[k]=(inp.type==="range")?parseInt(inp.value,10):inp.value;syncCustom();renderPreview();if(inp.tagName==="SELECT"||inp.type==="range")renderGlobal();});});
  const bindG=(id,key,pv)=>{const el=document.getElementById(id);if(el)el.addEventListener('input',()=>{commitDebounced();state.settings[key]=el.value;if(pv)renderPreview();});};
  bindG("gTel","tel",true);bindG("gWa","wa",true);bindG("gEp","endpoint",true);
  bindG("gTitle","title",false);bindG("gDesc","desc",false);bindG("gGtm","gtm",false);bindG("gSlug","slug",false);
  const cs=document.getElementById("gCtaStyle");if(cs)cs.addEventListener('change',()=>{commit();state.settings.ctaStyle=cs.value;renderPreview();});
  const ca=document.getElementById("gCtaAction");if(ca)ca.addEventListener('change',()=>{commit();state.settings.ctaAction=ca.value;renderPreview();renderGlobal();});
  const pt=document.getElementById("gPopTitle");if(pt)pt.addEventListener('input',()=>{commitDebounced();state.settings.popupTitle=pt.value;renderPreview();});
  const co=document.getElementById("gCookies");if(co)co.addEventListener('change',()=>{commit();state.settings.cookies=co.checked;renderPreview();});
  const th=document.getElementById("gThanks");if(th)th.addEventListener('change',()=>{commit();state.settings.thanks=th.checked;renderPreview();renderGlobal();});
  const tt=document.getElementById("gThanksTxt");if(tt)tt.addEventListener('input',()=>{commitDebounced();state.settings.thanksText=tt.value;renderPreview();});
  gf.querySelectorAll('[data-upbtn]').forEach(btn=>btn.addEventListener('click',()=>gf.querySelector('[data-file="'+btn.dataset.upbtn+'"]').click()));
  gf.querySelectorAll('[data-file]').forEach(inp=>inp.addEventListener('change',e=>readImg(e.target.files[0],url=>{commit();state.settings[inp.dataset.file]=url;renderGlobal();renderPreview();})));
  gf.querySelectorAll('[data-rm]').forEach(btn=>btn.addEventListener('click',()=>{commit();state.settings[btn.dataset.rm]="";renderGlobal();renderPreview();}));
}

/* ---------- ACCIONES ---------- */
function addSection(type,index){commit();const s={id:nid(),type,props:LIB[type].def(),style:{}};
  if(index==null||index<0||index>state.sections.length)state.sections.push(s);else state.sections.splice(index,0,s);
  state.selected=s.id;renderPreview();renderRight();toast(LIB[type].label+" añadido");}
function select(id){state.selected=id;setTab("content");pendingScrollId=id;renderPreview();renderRight();}
function rowAction(id,act){const i=state.sections.findIndex(x=>x.id===id);if(i<0)return;commit();
  if(act==="up"&&i>0){const t=state.sections[i-1];state.sections[i-1]=state.sections[i];state.sections[i]=t;}
  if(act==="down"&&i<state.sections.length-1){const t=state.sections[i+1];state.sections[i+1]=state.sections[i];state.sections[i]=t;}
  if(act==="dup"){const c=JSON.parse(JSON.stringify(state.sections[i]));c.id=nid();state.sections.splice(i+1,0,c);state.selected=c.id;}
  if(act==="del"){state.sections.splice(i,1);if(state.selected===id)state.selected=null;}
  renderPreview();renderRight();renderPalette();}
let dragId=null,dragType=null;
function dropOnIndex(t){if(dragType){addSection(dragType,t);dragType=null;return;}
  if(dragId){commit();const from=state.sections.findIndex(x=>x.id===dragId);if(from<0)return;const m=state.sections.splice(from,1)[0];let to=t;if(from<t)to=t-1;state.sections.splice(to,0,m);dragId=null;renderPreview();renderRight();renderPalette();}}
function showDrop(on){const d=document.getElementById("dropZone");d.style.display=on?"grid":"none";}
function resetDrag(){dragType=null;dragId=null;showDrop(false);}
document.addEventListener('dragend',resetDrag,true);
document.addEventListener('drop',()=>setTimeout(resetDrag,0),true);
window.addEventListener('mouseup',()=>{ if(dragType||dragId) resetDrag(); });

/* ---------- HISTORIAL ---------- */
let past=[],future=[];
const snap=()=>JSON.stringify({s:state.sections,g:state.settings,c:CUSTOM,u:uid});
function commit(){past.push(snap());if(past.length>50)past.shift();future=[];updHist();}
let cdArmed=true,cdT=null;
function commitDebounced(){if(cdArmed){commit();cdArmed=false;}clearTimeout(cdT);cdT=setTimeout(()=>cdArmed=true,700);}
function restore(str){const o=JSON.parse(str);state.sections=o.s;state.settings=o.g;Object.assign(CUSTOM,o.c);uid=o.u;syncCustom();}
function undo(){if(!past.length)return;future.push(snap());restore(past.pop());state.selected=null;document.getElementById("brandTop").value=state.settings.brand;renderPreview();renderRight();renderPalette();updHist();}
function redo(){if(!future.length)return;past.push(snap());restore(future.pop());state.selected=null;document.getElementById("brandTop").value=state.settings.brand;renderPreview();renderRight();renderPalette();updHist();}
function updHist(){document.getElementById("btnUndo").disabled=!past.length;document.getElementById("btnRedo").disabled=!future.length;}

/* ---------- TABS / DEVICE / EXPORT / PLANTILLAS ---------- */
function setTab(t){state.tab=t;document.getElementById("tabContent").style.display=t==="content"?"":"none";
  document.getElementById("tabStyle").style.display=t==="style"?"":"none";document.getElementById("tabGlobal").style.display=t==="global"?"":"none";
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));}
function setDevice(d){state.device=d;const w={mobile:"390px",tablet:"768px",desktop:"100%"}[d];const fw=document.getElementById("frameWrap");
  fw.style.width=w;fw.style.maxWidth=d==="desktop"?"1100px":w;document.querySelectorAll('#devSeg button').forEach(b=>b.classList.toggle('on',b.dataset.dev===d));}
function dlBlob(data,name,type){const blob=(data instanceof Blob)?data:new Blob([data],{type:type||"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();}
function buildReadme(html){
  const s=state.settings;const b=BRANDS[s.brand];
  const phs=[...new Set((html.match(/\{\{[A-Z0-9_]+\}\}/g)||[]))];
  const phHint={TELEFONO:"Teléfono real (tel:)",WHATSAPP:"Número WhatsApp con prefijo",ENDPOINT_FORMULARIO:"URL a la que hace POST el formulario",GTM_ID:"ID de Google Tag Manager","GTM-XXXXXXX":"ID de Google Tag Manager",URL_CANONICA:"URL final de la página",URL_LEGAL:"URL de aviso legal / privacidad",URL_COOKIES:"URL de política de cookies",RAZON_SOCIAL:"Razón social para el footer",TITULO_SEO:"Título SEO (<title>)",META_DESCRIPTION:"Meta description",LOGO:"Logo de la marca",IMG_HERO:"Imagen del hero",IMG_POPUP:"Imagen del popup",IMG:"Imagen"};
  const list=phs.length?phs.map(p=>{const k=p.replace(/[{}]/g,"");return "- `"+p+"` — "+(phHint[k]||"Rellenar");}).join("\n"):"- (ninguno pendiente)";
  const fam=(b.fhead+","+b.fbody).match(/'([^']+)'/g);const fonts=fam?[...new Set(fam.map(x=>x.replace(/'/g,"")))].join(", "):"—";
  return "# Landing — handoff para desarrollo\n\n"+
"Página de conversión generada con **NC Landing Builder**. Es HTML estático listo para maquetar/desplegar.\n\n"+
"## Stack\n- **Bootstrap 5.3.3** (por CDN).\n- **Google Fonts**: "+fonts+".\n- CSS propio en `css/styles.css` (tokens de marca + componentes).\n- JS propio en `js/main.js` (tracking dataLayer, acciones de CTA, widgets: calculadora/calendario/quiz, cookies).\n\n"+
"## Estructura\n```\nindex.html        # markup de la landing\ncss/styles.css    # estilos (variables de marca + componentes)\njs/main.js        # comportamiento (tracking, CTAs, widgets)\nREADME.md\n```\n\n"+
"## Marca aplicada: "+b.name+"\nVariables CSS (en `:root` dentro de `index.html`):\n```css\n"+b.vars.replace(/;/g,";\n")+"\n```\n\n"+
"## Datos a rellenar (placeholders)\nBusca y sustituye en `index.html`:\n"+list+"\n\n"+
"## Configuración actual\n- Teléfono: "+(s.tel||"(pendiente)")+"\n- WhatsApp: "+(s.wa||"(pendiente)")+"\n- Endpoint formulario: "+(s.endpoint||"(pendiente)")+"\n- GTM: "+(s.gtm||"(pendiente)")+"\n- Acción CTA principal: "+s.ctaAction+"\n\n"+
"## Medición (dataLayer)\nEventos que ya se disparan: `cta_click`, `generate_lead`, `schedule`, `quiz_complete`. Conéctalos en GTM.\n\n"+
"## Despliegue\n- **FTP**: sube la carpeta tal cual (index.html + css/ + js/).\n- **Vercel/estático**: arrastra la carpeta o conéctala a un repo (sin build).\n\n"+
"## Notas\n- Las imágenes son URLs (Supabase Storage) o Base64 embebido.\n- Mobile-first; probar en móvil.\n";
}
function exportZip(){
  const full=buildDoc(true);const slug=(state.settings.slug||"landing");
  let css="";
  let html=full.replace(/<style>([\s\S]*?)<\/style>/,function(m,c){css=c;return '<link rel="stylesheet" href="css/styles.css">';});
  let js="";
  html=html.replace(/<script>([\s\S]*?)<\/script>/g,function(m,c){if(/gtm\.start/.test(c))return m;js+=c+"\n";return "";});
  html=html.replace("</body>",'<script src="js/main.js"><\/script>\n</body>');
  const readme=buildReadme(full);
  if(!window.JSZip){ toast("Sin JSZip: descargo HTML autocontenido"); dlBlob(full,slug+".html","text/html;charset=utf-8"); return; }
  const zip=new JSZip();const root=zip.folder(slug);
  root.file("index.html",html);root.file("css/styles.css",css.trim());root.file("js/main.js",js.trim());root.file("README.md",readme);
  zip.generateAsync({type:"blob"}).then(function(blob){dlBlob(blob,slug+".zip");toast("ZIP exportado ✓");}).catch(function(){dlBlob(full,slug+".html","text/html;charset=utf-8");});
}
function exportHTML(){const html=buildDoc(true);const kb=Math.round(html.length/1024);
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(state.settings.slug||"landing")+".html";document.body.appendChild(a);a.click();a.remove();
  toast("HTML exportado ✓ ("+kb+" KB)");}
const TEMPLATE_BRAND={"Apple (literal)":"apple","Movistar (literal)":"movistar","T-Mobile (literal)":"tmobile","O2 (literal)":"o2","MyTraffic (literal)":"mytraffic","AB Tasty (literal)":"abtasty"};
function loadTemplate(name){const t=TEMPLATES[name];if(!t)return;if(state.sections.length&&!confirm("¿Reemplazar la landing actual por la plantilla “"+name+"”?"))return;
  commit();const bk=TEMPLATE_BRAND[name];if(bk&&BRANDS[bk]){state.settings.brand=bk;const bt=document.getElementById("brandTop");if(bt)bt.value=bk;}
  state.sections=t.map(ty=>({id:nid(),type:ty,props:LIB[ty].def(),style:{}}));state.selected=null;renderPalette();renderPreview();renderRight();toast("Plantilla cargada");}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2100);}

/* ---------- LISTENERS ---------- */
window.addEventListener("message",e=>{if(!e.data)return;if(e.data.nc==="sel")select(e.data.id);if(e.data.nc==="act")rowAction(e.data.id,e.data.act);});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
document.querySelectorAll('#devSeg button').forEach(b=>b.addEventListener('click',()=>setDevice(b.dataset.dev)));
document.getElementById("btnExport").addEventListener('click',exportZip);
document.getElementById("btnUndo").addEventListener('click',undo);
document.getElementById("btnRedo").addEventListener('click',redo);
document.getElementById("palSearch").addEventListener('input',renderPalette);
setTimeout(()=>{const ps=document.getElementById("palSearch");if(ps&&/@/.test(ps.value)){ps.value="";renderPalette();}},500);
document.getElementById("btnPreview").addEventListener('click',()=>{try{const url=URL.createObjectURL(new Blob([buildDoc(true)],{type:"text/html;charset=utf-8"}));const w=window.open(url,"_blank");if(!w)toast("El navegador bloqueó la ventana · usa Exportar");}catch(e){toast("Aquí no se puede abrir en pestaña · usa Exportar");}});
document.getElementById("dropZone").addEventListener('dragover',e=>e.preventDefault());
document.getElementById("dropZone").addEventListener('drop',e=>{e.preventDefault();showDrop(false);if(dragType){addSection(dragType);dragType=null;}});
(function(){const sel=document.getElementById("brandTop");sel.innerHTML=brandOptions(state.settings.brand);sel.value=state.settings.brand;
  sel.addEventListener('change',e=>{commit();state.settings.brand=e.target.value;renderPalette();renderPreview();renderRight();});})();
(function(){const t=document.getElementById("tplSel");t.innerHTML='<option value="">Plantilla…</option>'+Object.keys(TEMPLATES).map(n=>`<option>${n}</option>`).join("");
  t.addEventListener('change',e=>{if(e.target.value)loadTemplate(e.target.value);e.target.value="";});})();
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||"");if(tag==="INPUT"||tag==="TEXTAREA")return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!e.shiftKey){e.preventDefault();undo();}
  else if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==="y"||(e.shiftKey&&e.key.toLowerCase()==="z"))){e.preventDefault();redo();}});

/* ---------- CLOUD (Supabase) ---------- */
window.NC_SB=null;
const cloud={id:null};
(function initSB(){
  try{
    if(window.NC_CONFIG&&window.NC_CONFIG.SUPABASE_URL&&window.supabase){
      window.NC_SB=window.supabase.createClient(window.NC_CONFIG.SUPABASE_URL,window.NC_CONFIG.SUPABASE_ANON_KEY);
    }
  }catch(e){}
})();
function cloudState(){return {sections:state.sections,settings:state.settings,custom:CUSTOM};}
function applyCloud(o){try{state.sections=o.sections||[];state.settings=Object.assign(state.settings,o.settings||{});if(o.custom)Object.assign(CUSTOM,o.custom);syncCustom();state.selected=null;document.getElementById("brandTop").value=state.settings.brand;renderPalette();renderPreview();renderRight();}catch(e){toast('Datos corruptos');}}
async function saveLanding(){
  if(!window.NC_SB){toast('Configura Supabase (config.js) para guardar');return;}
  const nombre=(document.getElementById("landingName").value||'Sin título').trim();
  const row={nombre,marca:state.settings.brand,data:cloudState(),updated_at:new Date().toISOString()};
  if(cloud.id)row.id=cloud.id;
  const {data,error}=await window.NC_SB.from('landings').upsert(row).select().single();
  if(error){toast('Error: '+error.message);return;}
  cloud.id=data.id;toast('Guardado ✓');
}
async function listLandings(){
  const box=document.getElementById("mineList");
  if(!window.NC_SB){box.innerHTML='<div class="empty">Configura Supabase (config.js) para usar la nube.</div>';return;}
  box.innerHTML='<div class="empty">Cargando…</div>';
  const {data,error}=await window.NC_SB.from('landings').select('id,nombre,marca,updated_at').order('updated_at',{ascending:false});
  if(error){box.innerHTML='<div class="empty">'+error.message+'</div>';return;}
  if(!data.length){box.innerHTML='<div class="empty">Aún no hay landings guardadas.</div>';return;}
  box.innerHTML=data.map(l=>`<div class="oitem" style="cursor:default"><span class="nm" style="cursor:pointer" data-load="${l.id}">${(l.nombre||'Sin título')} <span style="color:var(--muted2)">· ${(BRANDS[l.marca]?BRANDS[l.marca].name:l.marca)}</span></span>
    <button class="mini" data-dup="${l.id}" title="Duplicar">⧉</button><button class="mini" data-del="${l.id}" title="Borrar">🗑</button></div>`).join("");
  box.querySelectorAll('[data-load]').forEach(el=>el.addEventListener('click',()=>openLanding(el.dataset.load)));
  box.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>delLanding(el.dataset.del)));
  box.querySelectorAll('[data-dup]').forEach(el=>el.addEventListener('click',()=>dupLanding(el.dataset.dup)));
}
async function openLanding(id){
  const {data,error}=await window.NC_SB.from('landings').select('*').eq('id',id).single();
  if(error){toast(error.message);return;}
  cloud.id=data.id;document.getElementById("landingName").value=data.nombre||'';
  applyCloud(data.data||{});past=[];future=[];updHist();
  document.getElementById("mineOverlay").style.display='none';toast('Cargada: '+(data.nombre||''));
}
async function dupLanding(id){
  const {data}=await window.NC_SB.from('landings').select('*').eq('id',id).single();
  if(!data)return;await window.NC_SB.from('landings').insert({nombre:(data.nombre||'')+' (copia)',marca:data.marca,data:data.data,updated_at:new Date().toISOString()});
  listLandings();toast('Duplicada');
}
async function delLanding(id){
  if(!confirm('¿Borrar esta landing?'))return;
  await window.NC_SB.from('landings').delete().eq('id',id);
  if(cloud.id===id)cloud.id=null;listLandings();toast('Borrada');
}
function newLanding(){cloud.id=null;document.getElementById("landingName").value='';state.sections=[];state.selected=null;past=[];future=[];updHist();renderPreview();renderRight();document.getElementById("mineOverlay").style.display='none';toast('Nueva landing');}
/* Auth compartido */
function showLogin(v){document.getElementById("loginOverlay").style.display=v?'grid':'none';}
async function checkAuth(){
  if(!window.NC_SB){document.getElementById("userChip").textContent='local (sin nube)';return;}
  const {data}=await window.NC_SB.auth.getSession();
  if(data&&data.session){document.getElementById("userChip").textContent=data.session.user.email;showLogin(false);}
  else{showLogin(true);}
}
document.getElementById("loginBtn").addEventListener('click',async()=>{
  const email=document.getElementById("loginEmail").value.trim(),password=document.getElementById("loginPass").value;
  const {error}=await window.NC_SB.auth.signInWithPassword({email,password});
  if(error){document.getElementById("loginErr").textContent=error.message;return;}
  document.getElementById("userChip").textContent=email;showLogin(false);toast('Bienvenido');
});
document.getElementById("btnSave").addEventListener('click',saveLanding);
document.getElementById("btnMine").addEventListener('click',()=>{document.getElementById("mineOverlay").style.display='grid';listLandings();});
document.getElementById("mineClose").addEventListener('click',()=>document.getElementById("mineOverlay").style.display='none');
document.getElementById("mineNew").addEventListener('click',newLanding);
checkAuth();

/* ---------- SEED ---------- */
syncCustom();
TEMPLATES["Captación · llamada"].forEach(t=>state.sections.push({id:nid(),type:t,props:LIB[t].def(),style:{}}));
renderPalette();setTab("content");setDevice("desktop");renderRight();renderPreview();updHist();
</script>
</body>
